<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PointMeasure 3D</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="importPly">匯入 PLY</button>
        <button id="importScanFolder">匯入掃描資料夾</button>
        <button id="loadSample" class="dev-only">載入範例 PLY</button>
        <button id="resetView">重設視角</button>
        <button id="firstPerson">第一人稱</button>
        <button id="measureDistance">距離量測</button>
        <button id="measurePlane">平面量測</button>
        <button id="saveModel">儲存模型</button>
        <button id="loadModel">載入模型</button>
        <button id="clearCurrent">清除目前</button>
        <button id="clearAll">全部清除</button>
        <button id="exportCsv">匯出 CSV</button>
      </header>
      <main class="workspace">
        <section class="viewer-shell">
          <canvas id="viewport"></canvas>
        </section>
        <aside class="side-panel">
          <section class="panel-section">
            <h2>點雲資訊</h2>
            <div id="cloudInfo" class="info-grid">
              <span class="muted">尚未載入點雲</span>
            </div>
            <div class="control-row">
              <label for="renderPreset">顯示模式</label>
              <select id="renderPreset">
                <option value="stable">穩定點</option>
                <option value="default" selected>預設點雲</option>
              </select>
              <output id="renderPresetValue">預設點雲</output>
            </div>
            <div class="control-row">
              <label for="visualFilter">視覺過濾</label>
              <select id="visualFilter">
                <option value="none" selected>不過濾</option>
                <option value="clean">清理</option>
                <option value="strict">嚴格</option>
              </select>
              <output id="visualFilterValue">不過濾</output>
            </div>
            <div class="control-row toggle-row">
              <label for="gridVisible">格線</label>
              <input id="gridVisible" type="checkbox" checked />
              <output>開啟</output>
            </div>
            <div class="control-row toggle-row">
              <label for="axesVisible">座標軸</label>
              <input id="axesVisible" type="checkbox" checked />
              <output>開啟</output>
            </div>
            <div class="control-row">
              <label for="pointSize">點大小</label>
              <input id="pointSize" type="range" min="1" max="6" step="0.5" value="2" />
              <output id="pointSizeValue">2.0</output>
            </div>
            <div class="control-row">
              <label for="sampling">顯示取樣</label>
              <select id="sampling">
                <option value="1">全部點</option>
                <option value="2">每 2 點顯示 1 點</option>
                <option value="5">每 5 點顯示 1 點</option>
                <option value="10">每 10 點顯示 1 點</option>
              </select>
            </div>
            <div class="control-row">
              <label for="rayThreshold">射線容差</label>
              <input id="rayThreshold" type="range" min="0.005" max="0.25" step="0.005" value="0.05" />
              <output id="rayThresholdValue">0.050</output>
            </div>
            <div class="control-row">
              <label for="distanceMode">量測模式</label>
              <select id="distanceMode">
                <option value="3d" selected>3D 距離</option>
                <option value="horizontal">水平距離</option>
                <option value="vertical">垂直距離</option>
              </select>
              <output id="distanceModeValue">3D</output>
            </div>
            <div class="control-row">
              <label for="snapMode">吸附模式</label>
              <select id="snapMode">
                <option value="smart" selected>智慧吸附</option>
                <option value="edge">邊線</option>
                <option value="plane">局部平面</option>
                <option value="nearest">最近點</option>
              </select>
              <output id="snapModeValue">智慧</output>
            </div>
            <div class="control-row">
              <label for="snapRadius">吸附半徑</label>
              <input id="snapRadius" type="range" min="0.03" max="0.35" step="0.01" value="0.12" />
              <output id="snapRadiusValue">0.12 m</output>
            </div>
            <div class="control-row">
              <label for="moveSpeed">移動速度</label>
              <input id="moveSpeed" type="range" min="0.5" max="12" step="0.5" value="4" />
              <output id="moveSpeedValue">4.0</output>
            </div>
            <div class="control-row">
              <label for="endpointSize">端點大小</label>
              <input id="endpointSize" type="range" min="0.008" max="0.08" step="0.002" value="0.018" />
              <output id="endpointSizeValue">0.018</output>
            </div>
            <div class="control-row">
              <label for="lineThickness">線寬</label>
              <input id="lineThickness" type="range" min="0.002" max="0.05" step="0.001" value="0.008" />
              <output id="lineThicknessValue">0.008</output>
            </div>
          </section>
          <section class="panel-section">
            <h2>掃描資訊</h2>
            <div id="scanMetadata" class="info-grid">
              <span class="muted">尚未載入掃描資料夾</span>
            </div>
          </section>
          <section class="panel-section">
            <h2>RoomPlan 統計</h2>
            <div id="roomPlanStats" class="info-grid">
              <span class="muted">尚未載入 RoomPlan</span>
            </div>
            <div class="control-row toggle-row">
              <label for="roomPlanOverlayVisible">疊圖</label>
              <input id="roomPlanOverlayVisible" type="checkbox" checked />
              <output>開啟</output>
            </div>
            <div class="control-row toggle-row">
              <label for="roomPlanOverlayAutoAlign">自動對齊</label>
              <input id="roomPlanOverlayAutoAlign" type="checkbox" checked />
              <output>開啟</output>
            </div>
          </section>
          <section class="panel-section records-section">
            <h2>量測紀錄</h2>
            <div id="measurementRecords" class="records empty">尚無量測紀錄</div>
          </section>
          <section class="panel-section model-section">
            <h2>模型平面</h2>
            <div id="modelSurfaces" class="model-list empty">尚無模型平面</div>
          </section>
        </aside>
      </main>
      <footer class="statusbar">
        <span id="modeStatus">鍵盤導覽：啟用</span>
        <span id="cameraStatus">相機：-</span>
        <span id="hintStatus">WASD 移動 | 滾輪縮放 | 右鍵拖曳旋轉 | 左鍵拖曳量測 | 第一人稱可鎖定滑鼠</span>
        <span id="errorStatus"></span>
      </footer>
    </div>
    <script type="module" src="/src/renderer/App.ts"></script>
  </body>
</html>
